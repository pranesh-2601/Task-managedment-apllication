
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ff-head:'Fraunces',serif;
    --ff-mono:'DM Mono',monospace;
    --c-bg:#0f0f11;
    --c-surface:#17171a;
    --c-surface2:#1e1e23;
    --c-border:#2a2a31;
    --c-accent:#7c6af7;
    --c-accent2:#f7a26a;
    --c-text:#e8e6f0;
    --c-muted:#8a87a0;
    --c-success:#4fd1a1;
    --c-warn:#f7c26a;
    --c-danger:#f77a7a;
    --radius:10px;
  }
  body{font-family:var(--ff-mono);background:var(--c-bg);color:var(--c-text);min-height:100vh;font-size:13px}
  h1,h2,h3{font-family:var(--ff-head);font-weight:300}

  /* Auth Screen */
  #auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
  .auth-box{background:var(--c-surface);border:1px solid var(--c-border);border-radius:16px;padding:2.5rem;width:100%;max-width:380px}
  .auth-logo{font-family:var(--ff-head);font-size:2rem;font-weight:300;color:var(--c-accent);margin-bottom:0.25rem;letter-spacing:-1px}
  .auth-sub{color:var(--c-muted);font-size:12px;margin-bottom:2rem}
  .auth-tabs{display:flex;gap:4px;margin-bottom:1.5rem;background:var(--c-bg);padding:4px;border-radius:8px}
  .auth-tab{flex:1;padding:7px;text-align:center;cursor:pointer;border-radius:6px;font-family:var(--ff-mono);font-size:12px;color:var(--c-muted);border:none;background:transparent}
  .auth-tab.active{background:var(--c-surface2);color:var(--c-text)}
  .field{margin-bottom:1rem}
  .field label{display:block;font-size:11px;color:var(--c-muted);margin-bottom:6px;letter-spacing:0.5px}
  .field input{width:100%;background:var(--c-bg);border:1px solid var(--c-border);border-radius:8px;padding:10px 12px;color:var(--c-text);font-family:var(--ff-mono);font-size:13px;outline:none;transition:border 0.2s}
  .field input:focus{border-color:var(--c-accent)}
  .btn-primary{width:100%;background:var(--c-accent);border:none;border-radius:8px;padding:11px;color:#fff;font-family:var(--ff-head);font-size:15px;font-weight:300;cursor:pointer;letter-spacing:0.3px;transition:opacity 0.15s}
  .btn-primary:hover{opacity:0.88}
  .auth-err{color:var(--c-danger);font-size:12px;margin-top:0.75rem;text-align:center;min-height:16px}

  /* App Shell */
  #app-screen{display:none;min-height:100vh}
  .topbar{background:var(--c-surface);border-bottom:1px solid var(--c-border);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .topbar-left{display:flex;align-items:center;gap:1rem}
  .topbar-brand{font-family:var(--ff-head);font-size:1.3rem;font-weight:300;color:var(--c-accent)}
  .topbar-right{display:flex;align-items:center;gap:12px}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--c-accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;cursor:pointer}
  .btn-logout{background:transparent;border:1px solid var(--c-border);border-radius:6px;padding:5px 12px;color:var(--c-muted);font-family:var(--ff-mono);font-size:11px;cursor:pointer}
  .btn-logout:hover{color:var(--c-text);border-color:var(--c-text)}

  .main-layout{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 56px)}
  .sidebar{background:var(--c-surface);border-right:1px solid var(--c-border);padding:1.25rem;overflow-y:auto}
  .sidebar-section{margin-bottom:1.5rem}
  .sidebar-label{font-size:10px;letter-spacing:1px;color:var(--c-muted);text-transform:uppercase;margin-bottom:8px}
  .sidebar-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--c-muted);font-size:12px;transition:all 0.15s;border:none;background:transparent;width:100%;text-align:left}
  .sidebar-item:hover{background:var(--c-surface2);color:var(--c-text)}
  .sidebar-item.active{background:var(--c-surface2);color:var(--c-accent)}
  .sidebar-item i{font-size:15px}
  .badge-count{margin-left:auto;background:var(--c-accent);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}

  /* Main content */
  .content{padding:1.5rem;overflow-y:auto}
  .content-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
  .page-title{font-family:var(--ff-head);font-size:1.8rem;font-weight:300;color:var(--c-text)}
  .btn-new{display:flex;align-items:center;gap:6px;background:var(--c-accent);border:none;border-radius:8px;padding:9px 16px;color:#fff;font-family:var(--ff-mono);font-size:12px;cursor:pointer;transition:opacity 0.15s}
  .btn-new:hover{opacity:0.88}

  /* Stats row */
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
  .stat-card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:1rem}
  .stat-num{font-family:var(--ff-head);font-size:1.6rem;font-weight:300;margin-bottom:2px}
  .stat-lbl{font-size:11px;color:var(--c-muted)}

  /* Filters */
  .filters{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:center}
  .filter-btn{background:transparent;border:1px solid var(--c-border);border-radius:6px;padding:5px 12px;color:var(--c-muted);font-family:var(--ff-mono);font-size:11px;cursor:pointer;transition:all 0.15s}
  .filter-btn:hover,.filter-btn.active{border-color:var(--c-accent);color:var(--c-accent);background:rgba(124,106,247,0.08)}
  .search-wrap{position:relative;margin-left:auto}
  .search-wrap input{background:var(--c-surface);border:1px solid var(--c-border);border-radius:7px;padding:6px 10px 6px 30px;color:var(--c-text);font-family:var(--ff-mono);font-size:12px;outline:none;width:200px}
  .search-wrap input:focus{border-color:var(--c-accent)}
  .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--c-muted);font-size:14px}

  /* Task list */
  .task-list{display:flex;flex-direction:column;gap:6px}
  .task-item{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:12px 14px;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;transition:border-color 0.15s;cursor:pointer}
  .task-item:hover{border-color:var(--c-accent)}
  .task-item.done .task-title{text-decoration:line-through;color:var(--c-muted)}
  .task-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--c-border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.2s;margin-top:1px}
  .task-check.checked{background:var(--c-success);border-color:var(--c-success);color:#0f0f11}
  .task-title{font-size:13px;font-weight:500;margin-bottom:4px;line-height:1.4}
  .task-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag{font-size:10px;padding:2px 8px;border-radius:10px;letter-spacing:0.3px}
  .tag-priority-high{background:rgba(247,122,122,0.15);color:var(--c-danger)}
  .tag-priority-medium{background:rgba(247,194,106,0.15);color:var(--c-warn)}
  .tag-priority-low{background:rgba(79,209,161,0.15);color:var(--c-success)}
  .tag-cat{background:rgba(124,106,247,0.12);color:var(--c-accent)}
  .task-due{font-size:11px;color:var(--c-muted)}
  .task-due.overdue{color:var(--c-danger)}
  .task-actions{display:flex;gap:6px;opacity:0;transition:opacity 0.15s}
  .task-item:hover .task-actions{opacity:1}
  .icon-btn{background:transparent;border:1px solid var(--c-border);border-radius:6px;padding:4px;color:var(--c-muted);cursor:pointer;font-size:14px;display:flex;align-items:center}
  .icon-btn:hover{color:var(--c-text);border-color:var(--c-text)}
  .icon-btn.danger:hover{color:var(--c-danger);border-color:var(--c-danger)}

  .empty-state{text-align:center;padding:4rem 2rem;color:var(--c-muted)}
  .empty-state i{font-size:40px;display:block;margin-bottom:1rem;color:var(--c-border)}
  .empty-state p{font-size:13px}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:1.5rem}
  .modal{background:var(--c-surface);border:1px solid var(--c-border);border-radius:14px;padding:1.75rem;width:100%;max-width:480px}
  .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
  .modal-title{font-family:var(--ff-head);font-size:1.4rem;font-weight:300}
  .modal-close{background:transparent;border:1px solid var(--c-border);border-radius:6px;padding:5px;color:var(--c-muted);cursor:pointer;font-size:15px;display:flex}
  .modal-close:hover{color:var(--c-danger);border-color:var(--c-danger)}
  .modal .field textarea{width:100%;background:var(--c-bg);border:1px solid var(--c-border);border-radius:8px;padding:10px 12px;color:var(--c-text);font-family:var(--ff-mono);font-size:13px;outline:none;resize:vertical;min-height:80px}
  .modal .field textarea:focus{border-color:var(--c-accent)}
  .modal .field select{width:100%;background:var(--c-bg);border:1px solid var(--c-border);border-radius:8px;padding:10px 12px;color:var(--c-text);font-family:var(--ff-mono);font-size:13px;outline:none}
  .modal .field select:focus{border-color:var(--c-accent)}
  .modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem}
  .btn-cancel{background:transparent;border:1px solid var(--c-border);border-radius:7px;padding:8px 16px;color:var(--c-muted);font-family:var(--ff-mono);font-size:12px;cursor:pointer}
  .btn-cancel:hover{color:var(--c-text)}
  .btn-save{background:var(--c-accent);border:none;border-radius:7px;padding:8px 20px;color:#fff;font-family:var(--ff-mono);font-size:12px;cursor:pointer}
  .btn-save:hover{opacity:0.88}

  /* AI Panel */
  .ai-panel{background:var(--c-surface2);border:1px solid var(--c-border);border-radius:var(--radius);padding:1rem;margin-bottom:1.25rem;display:none}
  .ai-panel.visible{display:block}
  .ai-panel-header{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:11px;color:var(--c-accent);letter-spacing:0.5px}
  .ai-panel-body{font-size:12px;color:var(--c-muted);line-height:1.6;white-space:pre-wrap}
  .ai-loading{display:flex;gap:4px;align-items:center;color:var(--c-muted);font-size:12px}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--c-accent);animation:bounce 1s infinite}
  .dot:nth-child(2){animation-delay:0.15s}
  .dot:nth-child(3){animation-delay:0.3s}
  @keyframes bounce{0%,80%,100%{transform:scale(0.6);opacity:0.4}40%{transform:scale(1);opacity:1}}

  /* Detail panel (right side) */
  .detail-overlay{position:fixed;right:0;top:56px;width:360px;height:calc(100vh - 56px);background:var(--c-surface);border-left:1px solid var(--c-border);z-index:150;transform:translateX(100%);transition:transform 0.25s ease;overflow-y:auto;padding:1.5rem}
  .detail-overlay.open{transform:translateX(0)}
  .detail-close{float:right;background:transparent;border:1px solid var(--c-border);border-radius:6px;padding:5px;color:var(--c-muted);cursor:pointer;font-size:15px;display:flex}
  .detail-close:hover{color:var(--c-danger);border-color:var(--c-danger)}

  /* AI suggest btn */
  .btn-ai{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid rgba(124,106,247,0.4);border-radius:7px;padding:7px 12px;color:var(--c-accent);font-family:var(--ff-mono);font-size:11px;cursor:pointer;transition:all 0.15s}
  .btn-ai:hover{background:rgba(124,106,247,0.1)}

  @media(max-width:600px){
    .main-layout{grid-template-columns:1fr}
    .sidebar{display:none}
    .stats-row{grid-template-columns:repeat(2,1fr)}
    .detail-overlay{width:100%;top:56px}
  }
</style>

<h2 class="sr-only">Task management application with authentication, task CRUD, filtering, and AI-powered suggestions.</h2>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">Taskflow</div>
    <div class="auth-sub">Intelligent task management</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Sign in</button>
      <button class="auth-tab" onclick="switchTab('register')">Register</button>
    </div>
    <div class="field"><label>EMAIL</label><input type="email" id="auth-email" placeholder="you@example.com" value="demo@taskflow.app" /></div>
    <div class="field"><label>PASSWORD</label><input type="password" id="auth-pass" placeholder="••••••••" value="demo1234" /></div>
    <div id="reg-extra" style="display:none">
      <div class="field"><label>DISPLAY NAME</label><input type="text" id="auth-name" placeholder="Your name" /></div>
    </div>
    <button class="btn-primary" onclick="handleAuth()">Sign in</button>
    <div class="auth-err" id="auth-err"></div>
    <div style="margin-top:1rem;font-size:11px;color:var(--c-muted);text-align:center">Demo: demo@taskflow.app / demo1234</div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-brand">Taskflow</div>
    </div>
    <div class="topbar-right">
      <div class="avatar" id="user-avatar">D</div>
      <button class="btn-logout" onclick="logout()"><i class="ti ti-logout"></i> Sign out</button>
    </div>
  </div>
  <div class="main-layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Views</div>
        <button class="sidebar-item active" onclick="setView('all',this)"><i class="ti ti-layout-list"></i>All tasks <span class="badge-count" id="badge-all">0</span></button>
        <button class="sidebar-item" onclick="setView('today',this)"><i class="ti ti-calendar-event"></i>Today <span class="badge-count" id="badge-today">0</span></button>
        <button class="sidebar-item" onclick="setView('pending',this)"><i class="ti ti-circle-dot"></i>Pending <span class="badge-count" id="badge-pending">0</span></button>
        <button class="sidebar-item" onclick="setView('done',this)"><i class="ti ti-circle-check"></i>Completed</button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Priority</div>
        <button class="sidebar-item" onclick="setView('high',this)"><i class="ti ti-arrow-up" style="color:var(--c-danger)"></i>High priority</button>
        <button class="sidebar-item" onclick="setView('medium',this)"><i class="ti ti-minus" style="color:var(--c-warn)"></i>Medium</button>
        <button class="sidebar-item" onclick="setView('low',this)"><i class="ti ti-arrow-down" style="color:var(--c-success)"></i>Low priority</button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Categories</div>
        <div id="cat-list"></div>
      </div>
    </aside>
    <main class="content">
      <div class="content-header">
        <h1 class="page-title" id="page-title">All tasks</h1>
        <div style="display:flex;gap:8px">
          <button class="btn-ai" onclick="getAISuggestions()"><i class="ti ti-sparkles"></i>AI suggest</button>
          <button class="btn-new" onclick="openModal()"><i class="ti ti-plus"></i>New task</button>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card"><div class="stat-num" id="s-total">0</div><div class="stat-lbl">Total tasks</div></div>
        <div class="stat-card"><div class="stat-num" style="color:var(--c-warn)" id="s-pending">0</div><div class="stat-lbl">Pending</div></div>
        <div class="stat-card"><div class="stat-num" style="color:var(--c-success)" id="s-done">0</div><div class="stat-lbl">Completed</div></div>
        <div class="stat-card"><div class="stat-num" style="color:var(--c-danger)" id="s-overdue">0</div><div class="stat-lbl">Overdue</div></div>
      </div>

      <!-- AI Panel -->
      <div class="ai-panel" id="ai-panel">
        <div class="ai-panel-header"><i class="ti ti-sparkles"></i>AI INSIGHTS</div>
        <div class="ai-panel-body" id="ai-body"></div>
      </div>

      <!-- Filters -->
      <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
        <button class="filter-btn" onclick="setFilter('high',this)">High</button>
        <button class="filter-btn" onclick="setFilter('medium',this)">Medium</button>
        <button class="filter-btn" onclick="setFilter('low',this)">Low</button>
        <div class="search-wrap">
          <i class="ti ti-search search-icon"></i>
          <input type="text" placeholder="Search tasks..." id="search-input" oninput="renderTasks()" />
        </div>
      </div>

      <!-- Tasks -->
      <div class="task-list" id="task-list"></div>
    </main>
  </div>
</div>

<!-- Task Detail Panel -->
<div class="detail-overlay" id="detail-panel">
  <button class="detail-close" onclick="closeDetail()"><i class="ti ti-x"></i></button>
  <div id="detail-content"></div>
</div>

<!-- Task Modal -->
<div class="modal-overlay" id="task-modal" style="display:none" onclick="closeModalOutside(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title">New task</h2>
      <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="field"><label>TITLE *</label><input type="text" id="f-title" placeholder="What needs to be done?" /></div>
    <div class="field"><label>DESCRIPTION</label><textarea id="f-desc" placeholder="Add details..."></textarea></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field"><label>PRIORITY</label>
        <select id="f-priority">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div class="field"><label>DUE DATE</label><input type="date" id="f-due" /></div>
    </div>
    <div class="field"><label>CATEGORY</label><input type="text" id="f-cat" placeholder="e.g. Work, Personal..." /></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveTask()">Save task</button>
    </div>
  </div>
</div>

<script>
const USERS_KEY = 'tf_users', TASKS_KEY = 'tf_tasks', CUR_KEY = 'tf_current';

let users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
let tasks = JSON.parse(localStorage.getItem(TASKS_KEY) || '[]');
let currentUser = JSON.parse(localStorage.getItem(CUR_KEY) || 'null');
let editingId = null, currentView = 'all', currentFilter = 'all';

// Seed demo account + tasks
if (!users.find(u => u.email === 'demo@taskflow.app')) {
  users.push({id:'u1',email:'demo@taskflow.app',password:'demo1234',name:'Demo User'});
  localStorage.setItem(USERS_KEY, JSON.stringify(users));
}
if (tasks.length === 0) {
  const today = new Date().toISOString().split('T')[0];
  const past = new Date(Date.now()-2*864e5).toISOString().split('T')[0];
  const future = new Date(Date.now()+3*864e5).toISOString().split('T')[0];
  tasks = [
    {id:'t1',userId:'u1',title:'Design system audit',desc:'Review component library for consistency',priority:'high',category:'Design',due:today,done:false,created:Date.now()-1e6},
    {id:'t2',userId:'u1',title:'Write Q2 performance report',desc:'Compile metrics and KPIs',priority:'high',category:'Work',due:past,done:false,created:Date.now()-2e6},
    {id:'t3',userId:'u1',title:'Team sync meeting prep',desc:'Prepare agenda and slides',priority:'medium',category:'Work',due:today,done:true,created:Date.now()-3e6},
    {id:'t4',userId:'u1',title:'Update portfolio website',desc:'Add new case studies',priority:'medium',category:'Personal',due:future,done:false,created:Date.now()-4e6},
    {id:'t5',userId:'u1',title:'Read "Atomic Habits"',desc:'Finish chapters 8–12',priority:'low',category:'Personal',due:future,done:false,created:Date.now()-5e6},
    {id:'t6',userId:'u1',title:'Fix navigation bug on mobile',desc:'CSS overflow issue in header',priority:'high',category:'Dev',due:today,done:false,created:Date.now()-6e6},
  ];
  localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
}

// Init
if (currentUser) showApp();

function switchTab(t) {
  document.querySelectorAll('.auth-tab').forEach((el,i)=>el.classList.toggle('active',i===(t==='login'?0:1)));
  document.getElementById('reg-extra').style.display = t==='register'?'block':'none';
  document.querySelector('.btn-primary').textContent = t==='login'?'Sign in':'Create account';
  document.querySelector('.btn-primary').setAttribute('onclick','handleAuth("'+t+'")');
}

function handleAuth(mode='login') {
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  const err = document.getElementById('auth-err');
  if (!email||!pass){err.textContent='Please fill all fields';return}
  if (mode==='register') {
    if (users.find(u=>u.email===email)){err.textContent='Email already registered';return}
    const name = document.getElementById('auth-name').value.trim()||email.split('@')[0];
    const u = {id:'u'+Date.now(),email,password:pass,name};
    users.push(u); localStorage.setItem(USERS_KEY,JSON.stringify(users));
    currentUser=u;
  } else {
    const u = users.find(u=>u.email===email&&u.password===pass);
    if (!u){err.textContent='Invalid email or password';return}
    currentUser=u;
  }
  localStorage.setItem(CUR_KEY,JSON.stringify(currentUser));
  showApp();
}

function logout() {
  localStorage.removeItem(CUR_KEY);
  currentUser=null;
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('app-screen').style.display='none';
}

function showApp() {
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  const initials = currentUser.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('user-avatar').textContent=initials;
  updateStats(); updateCatList(); renderTasks();
}

function myTasks() {
  return tasks.filter(t=>t.userId===currentUser.id);
}

function updateStats() {
  const t=myTasks(), today=new Date().toISOString().split('T')[0];
  const done=t.filter(x=>x.done).length;
  const overdue=t.filter(x=>!x.done&&x.due&&x.due<today).length;
  document.getElementById('s-total').textContent=t.length;
  document.getElementById('s-pending').textContent=t.length-done;
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-overdue').textContent=overdue;
  document.getElementById('badge-all').textContent=t.length;
  document.getElementById('badge-today').textContent=t.filter(x=>x.due===today).length;
  document.getElementById('badge-pending').textContent=t.filter(x=>!x.done).length;
}

function updateCatList() {
  const cats=[...new Set(myTasks().map(t=>t.category).filter(Boolean))];
  const el=document.getElementById('cat-list');
  el.innerHTML=cats.map(c=>`<button class="sidebar-item" onclick="setView('cat:${c}',this)"><i class="ti ti-tag"></i>${c}</button>`).join('');
}

function setView(v, el) {
  currentView=v;
  document.querySelectorAll('.sidebar-item').forEach(x=>x.classList.remove('active'));
  if(el)el.classList.add('active');
  const titles={all:'All tasks',today:"Today's tasks",pending:'Pending tasks',done:'Completed',high:'High priority',medium:'Medium priority',low:'Low priority'};
  document.getElementById('page-title').textContent = v.startsWith('cat:') ? v.replace('cat:','') : (titles[v]||v);
  renderTasks();
}

function setFilter(f, el) {
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

function getFilteredTasks() {
  let t=myTasks();
  const today=new Date().toISOString().split('T')[0];
  const q=document.getElementById('search-input')?.value.toLowerCase()||'';
  if(currentView==='today') t=t.filter(x=>x.due===today);
  else if(currentView==='pending') t=t.filter(x=>!x.done);
  else if(currentView==='done') t=t.filter(x=>x.done);
  else if(currentView==='high') t=t.filter(x=>x.priority==='high');
  else if(currentView==='medium') t=t.filter(x=>x.priority==='medium');
  else if(currentView==='low') t=t.filter(x=>x.priority==='low');
  else if(currentView.startsWith('cat:')) t=t.filter(x=>x.category===currentView.slice(4));
  if(currentFilter!=='all') t=t.filter(x=>x.priority===currentFilter);
  if(q) t=t.filter(x=>(x.title+x.desc+x.category).toLowerCase().includes(q));
  return t.sort((a,b)=>{
    if(a.done!==b.done) return a.done?1:-1;
    const pr={high:0,medium:1,low:2};
    return pr[a.priority]-pr[b.priority];
  });
}

function renderTasks() {
  updateStats(); updateCatList();
  const t=getFilteredTasks();
  const el=document.getElementById('task-list');
  const today=new Date().toISOString().split('T')[0];
  if(t.length===0){
    el.innerHTML=`<div class="empty-state"><i class="ti ti-clipboard-off"></i><p>No tasks here yet.<br>Create one to get started.</p></div>`;
    return;
  }
  el.innerHTML=t.map(task=>{
    const overdue=task.due&&task.due<today&&!task.done;
    const dueLabel=task.due?`<span class="task-due${overdue?' overdue':''}">${overdue?'Overdue · ':''}<i class="ti ti-calendar" style="font-size:11px"></i> ${formatDate(task.due)}</span>`:'';
    return `<div class="task-item${task.done?' done':''}" onclick="openDetail('${task.id}')">
      <div class="task-check${task.done?' checked':''}" onclick="event.stopPropagation();toggleDone('${task.id}')">
        ${task.done?'<i class="ti ti-check" style="font-size:11px"></i>':''}
      </div>
      <div>
        <div class="task-title">${esc(task.title)}</div>
        <div class="task-meta">
          <span class="tag tag-priority-${task.priority}">${task.priority}</span>
          ${task.category?`<span class="tag tag-cat">${esc(task.category)}</span>`:''}
          ${dueLabel}
        </div>
      </div>
      <div class="task-actions">
        <button class="icon-btn" onclick="event.stopPropagation();openModal('${task.id}')" aria-label="Edit"><i class="ti ti-edit"></i></button>
        <button class="icon-btn danger" onclick="event.stopPropagation();deleteTask('${task.id}')" aria-label="Delete"><i class="ti ti-trash"></i></button>
      </div>
    </div>`;
  }).join('');
}

function formatDate(d){
  const today=new Date().toISOString().split('T')[0];
  const tom=new Date(Date.now()+864e5).toISOString().split('T')[0];
  if(d===today)return'Today';if(d===tom)return'Tomorrow';
  return new Date(d).toLocaleDateString('en',{month:'short',day:'numeric'});
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function toggleDone(id){
  const t=tasks.find(x=>x.id===id);
  if(t){t.done=!t.done;saveTasks();renderTasks();}
}

function deleteTask(id){
  tasks=tasks.filter(x=>x.id!==id);
  saveTasks();closeDetail();renderTasks();
}

function saveTasks(){localStorage.setItem(TASKS_KEY,JSON.stringify(tasks));}

// Modal
function openModal(id=null){
  editingId=id;
  const modal=document.getElementById('task-modal');
  document.getElementById('modal-title').textContent=id?'Edit task':'New task';
  if(id){
    const t=tasks.find(x=>x.id===id);
    document.getElementById('f-title').value=t.title;
    document.getElementById('f-desc').value=t.desc||'';
    document.getElementById('f-priority').value=t.priority;
    document.getElementById('f-due').value=t.due||'';
    document.getElementById('f-cat').value=t.category||'';
  } else {
    document.getElementById('f-title').value='';
    document.getElementById('f-desc').value='';
    document.getElementById('f-priority').value='medium';
    document.getElementById('f-due').value='';
    document.getElementById('f-cat').value='';
  }
  modal.style.display='flex';
  setTimeout(()=>document.getElementById('f-title').focus(),100);
}

function closeModal(){document.getElementById('task-modal').style.display='none';editingId=null;}
function closeModalOutside(e){if(e.target===document.getElementById('task-modal'))closeModal();}

function saveTask(){
  const title=document.getElementById('f-title').value.trim();
  if(!title)return;
  if(editingId){
    const t=tasks.find(x=>x.id===editingId);
    t.title=title;t.desc=document.getElementById('f-desc').value;
    t.priority=document.getElementById('f-priority').value;
    t.due=document.getElementById('f-due').value;
    t.category=document.getElementById('f-cat').value.trim();
  } else {
    tasks.push({id:'t'+Date.now(),userId:currentUser.id,title,desc:document.getElementById('f-desc').value,
      priority:document.getElementById('f-priority').value,due:document.getElementById('f-due').value,
      category:document.getElementById('f-cat').value.trim(),done:false,created:Date.now()});
  }
  saveTasks();closeModal();renderTasks();
}

// Detail panel
function openDetail(id){
  const t=tasks.find(x=>x.id===id);
  if(!t)return;
  const today=new Date().toISOString().split('T')[0];
  const overdue=t.due&&t.due<today&&!t.done;
  document.getElementById('detail-content').innerHTML=`
    <div style="margin-bottom:1.5rem">
      <span class="tag tag-priority-${t.priority}" style="margin-bottom:8px;display:inline-block">${t.priority} priority</span>
      <h2 style="font-family:var(--ff-head);font-size:1.4rem;font-weight:300;line-height:1.3;margin-bottom:0.5rem">${esc(t.title)}</h2>
      ${t.category?`<span class="tag tag-cat">${esc(t.category)}</span>`:''}
    </div>
    ${t.desc?`<p style="font-size:12px;color:var(--c-muted);line-height:1.7;margin-bottom:1.5rem">${esc(t.desc)}</p>`:''}
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:1.5rem;font-size:12px">
      ${t.due?`<div style="display:flex;gap:8px;align-items:center;color:${overdue?'var(--c-danger)':'var(--c-muted)'}"><i class="ti ti-calendar" style="font-size:15px"></i>${overdue?'Overdue · ':''}Due ${formatDate(t.due)}</div>`:''}
      <div style="display:flex;gap:8px;align-items:center;color:var(--c-muted)"><i class="ti ti-clock" style="font-size:15px"></i>Created ${new Date(t.created).toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'})}</div>
      <div style="display:flex;gap:8px;align-items:center;color:${t.done?'var(--c-success)':'var(--c-muted)'}"><i class="ti ti-${t.done?'circle-check':'circle-dot'}" style="font-size:15px"></i>${t.done?'Completed':'In progress'}</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn-new" style="flex:1" onclick="toggleDone('${t.id}');openDetail('${t.id}')">${t.done?'<i class="ti ti-refresh"></i> Reopen':'<i class="ti ti-check"></i> Mark done'}</button>
      <button class="btn-ai" onclick="getTaskAI('${t.id}')"><i class="ti ti-sparkles"></i>AI tips</button>
    </div>
    <div id="detail-ai" style="margin-top:1rem"></div>`;
  document.getElementById('detail-panel').classList.add('open');
}

function closeDetail(){document.getElementById('detail-panel').classList.remove('open');}

// AI features
async function getAISuggestions() {
  const panel=document.getElementById('ai-panel');
  const body=document.getElementById('ai-body');
  panel.classList.add('visible');
  body.innerHTML=`<div class="ai-loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span style="margin-left:6px">Analyzing your tasks...</span></div>`;
  const t=myTasks().filter(x=>!x.done);
  const summary=t.map(x=>`- "${x.title}" [${x.priority}]${x.due?' due '+x.due:''}`).join('\n');
  try {
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      model:'claude-sonnet-4-20250514',max_tokens:400,
      messages:[{role:'user',content:`You are a productivity coach. Review these pending tasks and give 3 concise actionable insights (prioritization, deadlines, suggestions). Keep it under 150 words. No markdown, plain text only.\n\nTasks:\n${summary}`}]
    })});
    const d=await res.json();
    body.textContent=d.content?.[0]?.text||'Could not generate insights.';
  } catch(e){body.textContent='AI suggestions unavailable. Check your connection.';}
}

async function getTaskAI(id) {
  const t=tasks.find(x=>x.id===id);
  const el=document.getElementById('detail-ai');
  el.innerHTML=`<div class="ai-panel" style="display:block"><div class="ai-panel-header"><i class="ti ti-sparkles"></i>AI TIPS</div><div class="ai-panel-body"><div class="ai-loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span style="margin-left:6px">Thinking...</span></div></div></div>`;
  try {
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      model:'claude-sonnet-4-20250514',max_tokens:250,
      messages:[{role:'user',content:`Give 2-3 short, practical tips for completing this task effectively. Plain text, no markdown, under 100 words.\n\nTask: "${t.title}"\nDescription: "${t.desc||'none'}"\nPriority: ${t.priority}\nDue: ${t.due||'no deadline'}`}]
    })});
    const d=await res.json();
    el.innerHTML=`<div class="ai-panel" style="display:block"><div class="ai-panel-header"><i class="ti ti-sparkles"></i>AI TIPS</div><div class="ai-panel-body">${esc(d.content?.[0]?.text||'No tips available.')}</div></div>`;
  } catch(e){el.innerHTML='';}
}

renderTasks();
</script>
